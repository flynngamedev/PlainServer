[package]
name = "pls-transpiler"
version = "2.6.0"
edition = "2021"
description = "Lexer, LALRPOP grammar, and AST for the PlainServer (.pls) language"

[lib]
name = "pls_transpiler"
path = "src/lib.rs"

[[bin]]
name = "plsc"
path = "src/bin/plsc.rs"

[dependencies]
lalrpop-util = { version = "0.20", features = ["lexer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
lalrpop = { version = "0.20", default-features = false }

[dev-dependencies]
